{% extends 'base.html' %}
{% block content %}
  <div class="mt-4">
    <h2 class="mb-3">Удалить клиента</h2>
    <p>Вы уверены, что хотите удалить клиента: <strong>{{ object.full_name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Подтвердить</button>
      <a class="btn btn-secondary" href="{% url 'mailing:client-list' %}">Отмена</a>
    </form>
  </div>
{% endblock %}
