{% extends 'base.html' %}
{% block content %}
  <div class="mt-4">
    <h2 class="mb-3">Удалить рассылку</h2>
    <p>Вы уверены, что хотите удалить рассылку: <strong>{{ object.message.subject }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Подтвердить</button>
      <a class="btn btn-secondary" href="{% url 'mailing:mailing-list' %}">Отмена</a>
    </form>
  </div>
{% endblock %}
